<!DOCTYPE html>
<html lang="sr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>ONLINE SHOP</title>

    <link rel="stylesheet" href="css/style.css">
</head>

<body>

<header class="header">
    <div class="container header-inner">

        <div class="logo">
            <img src="LOGO.png" alt="DVA STAMPACA" style="width:67px;height:67px;">
        </div>

        <button class="cart-button" onclick="openCart()">
            🛒 Korpa
            <span id="cart-count">0</span>
        </button>

    </div>
</header>


<main>

    <section class="hero">

        <div class="container">

            <h1>Dobrodošli u našu prodavnicu</h1>

            <p>
                Izaberite proizvode i napravite porudžbinu.
            </p>

        </div>

    </section>

<div class="spajac">
    <section class="categories-section">

        <div class="container">

            <h2>Kategorije</h2>

            <div id="categories" class="categories"></div>

        </div>

    </section>


    <section class="products-section">

        <div class="container">

            <div class="section-title">

                <h2>Proizvodi</h2>

                <span id="product-count"></span>

            </div>

            <div id="products" class="products"></div>

        </div>

    </section>
</div>
</main>


<!-- KORPA -->

<div id="cart-modal" class="modal">

    <div class="modal-content">

        <div class="modal-header">

            <h2>🛒 Vaša korpa</h2>

            <button onclick="closeCart()" class="close-button">
                ×
            </button>

        </div>


        <div id="cart-items"></div>


        <div class="cart-total">

            <span>Ukupno:</span>

            <strong id="cart-total">0 RSD</strong>

        </div>


        <button
            id="checkout-button"
            class="primary-button"
            onclick="openCheckout()">

            Nastavi na poručivanje

        </button>

    </div>

</div>


<!-- PORUDŽBINA -->

<div id="checkout-modal" class="modal">

    <div class="modal-content">

        <div class="modal-header">

            <h2>📦 Poručivanje</h2>

            <button onclick="closeCheckout()" class="close-button">
                ×
            </button>

        </div>


        <form id="order-form">

            <label>
                Ime i prezime
            </label>

            <input
                type="text"
                id="customer-name"
                required
                placeholder="Vaše ime i prezime">


            <label>
                Telefon
            </label>

            <input
                type="tel"
                id="customer-phone"
                required
                placeholder="06x xxx xxxx">


            <label>
                Adresa
            </label>

            <input
                type="text"
                id="customer-address"
                required
                placeholder="Ulica i broj">


            <label>
                Grad
            </label>

            <input
                type="text"
                id="customer-city"
                required
                placeholder="Grad">


            <label>
                Napomena
            </label>

            <textarea
                id="customer-note"
                placeholder="Dodatna napomena (opciono)">
            </textarea>


            <div class="checkout-summary">

                <span>Ukupno za plaćanje:</span>

                <strong id="checkout-total">
                    0 RSD
                </strong>

            </div>


            <button
                type="submit"
                class="primary-button">

                Potvrdi porudžbinu

            </button>

        </form>

    </div>

</div>


<!-- USPEŠNA PORUDŽBINA -->

<div id="success-modal" class="modal">

    <div class="modal-content success-content">

        <div class="success-icon">
            ✓
        </div>

        <h2>Porudžbina je primljena!</h2>

        <p>
            Hvala na porudžbini.
        </p>

        <p>
            Uskoro ćemo vas kontaktirati.
        </p>

        <button
            class="primary-button"
            onclick="closeSuccess()">

            U redu

        </button>

    </div>

</div>


<script src="js/app.js"></script>

</body>
</html>
